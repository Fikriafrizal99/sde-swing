name: Validate Exit Engine Volume State

on:
  pull_request:
    paths:
      - .github/workflows/hotfix-exit-volume.yml
      - modules/exit_engine/exit_engine.py
      - modules/exit_engine/exit_engine_baseline.py
      - tests/test_signal_quality_v160.py
      - tests/test_release_governance_workflow.py
  push:
    branches: [main, "agent/**", "audit/**"]
    paths:
      - .github/workflows/hotfix-exit-volume.yml
      - modules/exit_engine/exit_engine.py
      - modules/exit_engine/exit_engine_baseline.py
      - tests/test_signal_quality_v160.py
      - tests/test_release_governance_workflow.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering revision without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Inspect existing volume-state contract
        shell: python
        run: |
          from pathlib import Path

          source = Path("modules/exit_engine/exit_engine_baseline.py").read_text(
              encoding="utf-8"
          )
          required = (
              "volume_confirmed: bool | None = None",
              '"Volume_Confirmation_Pass": volume_confirmed',
          )
          missing = [fragment for fragment in required if fragment not in source]
          if missing:
              raise SystemExit(f"Volume-state contract missing: {missing}")
          print("Volume-state contract is present; no patch was applied.")

      - name: Validate source and regression contracts
        run: |
          python -m py_compile modules/exit_engine/exit_engine.py modules/exit_engine/exit_engine_baseline.py
          python -m pytest -q tests/test_signal_quality_v160.py tests/test_release_governance_workflow.py

      - name: Verify validation left tracked files unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code
