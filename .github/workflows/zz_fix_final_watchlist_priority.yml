name: Apply Final Watchlist Priority Hotfix

on:
  push:
    branches:
      - agent/sde-swing-v1-7-0-multisource
    paths:
      - .github/workflows/zz_fix_final_watchlist_priority.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sde-swing-v1-7-0-multisource
          fetch-depth: 0

      - name: Patch final watchlist ranking and summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          report_path = Path('modules/job_runner/enhanced_daily_reports.py')
          lines = report_path.read_text(encoding='utf-8').splitlines()

          anchor = '        rows = self._enrich_watchlist_rows([dict(row) for row in data.get("rows", [])])'
          if anchor not in lines:
              raise SystemExit('ranking pre-sort anchor not found')
          i = lines.index(anchor)
          insert = [
              '        # Spend the limited AI budget on the actual best candidates first.',
              '        # `confidence` is Final_Score_V3 from the decision engine, so this is',
              '        # presentation ordering only and never recalculates an engine score.',
              '        ai_priority = {"BUY_READY": 0, "BUY_CANDIDATE": 1, "WATCH": 2}',
              '        rows.sort(key=lambda row: (',
              '            ai_priority.get(self._decision_bucket(row.get("decision")), 99),',
              '            -self._ranking_value(row, "confidence"),',
              '            int(_float(row.get("rank"), 9999)),',
              '        ))',
          ]
          if '        ai_priority = {"BUY_READY": 0, "BUY_CANDIDATE": 1, "WATCH": 2}' not in lines:
              lines[i + 1:i + 1] = insert

          start_line = '        selected.sort(key=lambda row: ('
          if start_line not in lines:
              raise SystemExit('selected sort anchor not found')
          s = lines.index(start_line)
          e = s + 1
          while e < len(lines) and lines[e] != '        ))':
              e += 1
          if e >= len(lines):
              raise SystemExit('selected sort end not found')
          replacement = [
              '        selected.sort(key=lambda row: (',
              '            priority.get(self._decision_bucket(row.get("decision")), 99),',
              '            # Final_Score_V3 is the canonical cross-factor score produced by',
              '            # the decision engine. Rank by it before presentation tie-breaks.',
              '            -self._ranking_value(row, "confidence"),',
              '            -self._ranking_value(row, "entry_readiness"),',
              '            abs(self._ranking_value(row, "entry_distance_pct", 9999.0)),',
              '            -self._ranking_value(row, "broker_confidence", self._ranking_value(row, "broker_score")),',
              '            -self._ranking_value(row, "technical_quality", self._ranking_value(row, "technical_score")),',
              '            -self._ranking_value(row, "risk_reward"),',
              '            int(_float(row.get("rank"), 9999)),',
              '        ))',
          ]
          lines[s:e + 1] = replacement

          old_top = '            "top_priority": selected[:3],'
          if old_top in lines:
              lines[lines.index(old_top)] = '            "top_priority": selected[:5],'
          elif '            "top_priority": selected[:5],' not in lines:
              raise SystemExit('top_priority anchor not found')

          report_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          ui_path = Path('modules/telegram/daily_report_ui.py')
          ui_lines = ui_path.read_text(encoding='utf-8').splitlines()
          marker = 'def format_final_watchlist_summary(data: dict[str, Any]) -> str:'
          starts = [idx for idx, line in enumerate(ui_lines) if line == marker]
          if not starts:
              raise SystemExit('final summary formatter not found')
          start = starts[-1]

          for idx in range(start, len(ui_lines)):
              if ui_lines[idx].strip() == '"<b>🎯 PRIORITAS EKSEKUSI</b>",':
                  ui_lines[idx] = '        "<b>🏆 TOP 5 PRIORITAS</b>",'
                  break
          else:
              if not any('TOP 5 PRIORITAS' in line for line in ui_lines[start:]):
                  raise SystemExit('priority title anchor not found')

          for idx in range(start, len(ui_lines)):
              if ui_lines[idx].strip() == 'for index, row in enumerate(top[:3], 1):':
                  indent = ui_lines[idx][:len(ui_lines[idx]) - len(ui_lines[idx].lstrip())]
                  ui_lines[idx] = indent + 'for index, row in enumerate(top[:5], 1):'
                  break
          else:
              if not any('enumerate(top[:5], 1)' in line for line in ui_lines[start:]):
                  raise SystemExit('top priority loop anchor not found')

          footer = '    lines += ["", "Prioritas memakai kesiapan eksekusi, bukan score saja.", *(_runtime_zapi_lines(data) or [])]'
          if footer in ui_lines[start:]:
              idx = ui_lines.index(footer, start)
              ui_lines[idx:idx + 1] = [
                  '    lines += [',
                  '        "",',
                  '        SEPARATOR,',
                  '        "📌 5 kartu berikut adalah 5 saham terbaik berdasarkan status eksekusi dan Final Score.",',
                  '        "📎 CSV tetap memuat seluruh saham aktif.",',
                  '    ]',
              ]
          elif not any('5 kartu berikut adalah 5 saham terbaik' in line for line in ui_lines[start:]):
              raise SystemExit('summary footer anchor not found')

          ui_path.write_text('\n'.join(ui_lines) + '\n', encoding='utf-8')
          PY

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/zz_fix_final_watchlist_priority.yml
          git add modules/job_runner/enhanced_daily_reports.py modules/telegram/daily_report_ui.py
          git commit -m "fix: rank final watchlist by canonical final score"
          git push origin HEAD:agent/sde-swing-v1-7-0-multisource
